# From the repository root: conda env create -f environment.yml
name: flowmaps
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip
  - git
  - pip:
      # CUDA 12.6 wheels support the local V100 (sm_70) GPUs.
      - --extra-index-url https://download.pytorch.org/whl/cu126
      - torch==2.10.0+cu126
      - -r requirements.txt
